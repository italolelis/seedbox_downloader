services:
  seedbox-downloader:
    build: .
    environment:
      # Application config
      - DOWNLOAD_CLIENT=putio
      - PUTIO_TOKEN=${PUTIO_TOKEN}
      - TARGET_LABEL=seedbox
      - DOWNLOAD_DIR=/downloads
      - POLLING_INTERVAL=5m
      - LOG_LEVEL=INFO

      # Telemetry config. Metrics leave over OTLP only -- the application opens no
      # scrape endpoint, so they go to the collector, which Prometheus scrapes.
      - TELEMETRY_ENABLED=true
      - TELEMETRY_OTEL_ADDRESS=otel-collector:4317
      - TELEMETRY_SERVICE_NAME=seedbox_downloader

      # Web config
      - WEB_BIND_ADDRESS=0.0.0.0:9091
    ports:
      - "9091:9091" # Main API
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    networks:
      - monitoring
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "8889:8889" # Prometheus exporter, scraped by Prometheus
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:


networks:
  monitoring:
    driver: bridge
